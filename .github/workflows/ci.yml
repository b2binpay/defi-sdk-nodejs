name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # package.json devEngines requires npm ^12.1.0; Node 24 bundles npm 11.
      - run: npm install -g npm@12.1.0 --no-audit --no-fund
      - run: npm ci
      - run: npm run lint
      - run: npm run build
